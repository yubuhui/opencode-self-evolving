name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run self-check
        run: npm test

  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run installer into sandbox HOME
        run: |
          export HOME="$RUNNER_TEMP/kit-home"
          bash install.sh
          test -f "$HOME/.config/opencode/AGENTS.md"
          test -d "$HOME/.config/opencode/skills/auto-skill-creator"
          test -d "$HOME/.config/opencode/skills/plan-review"
          test -f "$HOME/.config/opencode/check-rules.mjs"
          test -f "$HOME/.config/opencode/package.json"
          test -f "$HOME/.config/opencode/opencode.json"
          echo "install.sh OK"

